<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 380" role="img" aria-labelledby="title desc"><title id="title">CTV-DGG: prompt-conditioned geometric completion</title><desc id="desc">CT, organs at risk and 3, 5 or 7 complete contours produce three geometric candidates. Learned bounded weights fuse the candidates and supplied contour planes are restored exactly. A conceptual schematic without patient data.</desc><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0 0L10 5L0 10" fill="none" stroke="#60758c" stroke-width="1.5"/></marker></defs><rect width="960" height="380" rx="12" fill="#f1f5fa"/><g font-family="Arial,sans-serif"><text x="35" y="45" fill="#345b8b" font-size="15" letter-spacing="2">CTV-DGG / METHOD AT A GLANCE</text><g fill="white" stroke="#ccd8e6"><rect x="35" y="105" width="185" height="166" rx="10"/><rect x="264" y="105" width="210" height="166" rx="10"/><rect x="520" y="105" width="190" height="166" rx="10"/><rect x="756" y="105" width="170" height="166" rx="10"/></g><g fill="#12263e" font-size="19" font-weight="bold"><text x="54" y="137">Case information</text><text x="284" y="137">Candidate geometry</text><text x="541" y="137">Adaptive fusion</text><text x="777" y="137">3D completion</text></g><g fill="#50647b" font-size="17"><text x="54" y="178">Planning CT + OARs</text><text x="54" y="207">3 / 5 / 7 complete</text><text x="54" y="232">axial contours</text><text x="284" y="178">Linear-mask</text><text x="284" y="207">SDF-base</text><text x="284" y="236">SDF-area</text><text x="541" y="178">Bounded corrections</text><text x="541" y="207">Voxelwise weights</text><text x="541" y="236">Convex combination</text><text x="777" y="178">Restore supplied</text><text x="777" y="207">planes exactly</text><text x="777" y="236">Return CTV mask</text></g><g stroke="#60758c" stroke-width="2" marker-end="url(#arrow)"><path d="M224 188H256"/><path d="M478 188H512"/><path d="M714 188H748"/></g><text x="35" y="333" fill="#50647b" font-size="16">Geometric hypotheses guide the prediction. Supplied foreground and background remain unchanged.</text></g></svg>